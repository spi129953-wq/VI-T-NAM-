name: SSH via Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Install SSH server
        run: |
          sudo apt update
          sudo apt install -y openssh-server curl
          sudo mkdir -p /var/run/sshd

      - name: Configure SSH
        run: |
          sudo useradd -m runner || true
          echo "runner:123456" | sudo chpasswd

          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/g' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config

          sudo systemctl enable ssh
          sudo systemctl restart ssh

      - name: Install cloudflared
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --url ssh://localhost:22 > tunnel.log 2>&1 &
          sleep 15

      - name: Extract SSH endpoint
        run: |
          URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare.com' tunnel.log | head -n1)

          echo ""
          echo "===================================="
          echo "SSH USER: runner"
          echo "SSH PASS: 123456"
          echo ""
          echo "SSH COMMAND:"
          echo "ssh -o ProxyCommand='cloudflared access ssh --hostname %h' runner@$URL"
          echo "===================================="
          echo ""

          echo "::notice::SSH => ssh -o ProxyCommand='cloudflared access ssh --hostname %h' runner@$URL"

      - name: Show tunnel log
        run: |
          echo "========== CLOUDFLARE LOG =========="
          cat tunnel.log
          echo "==================================="

      - name: Keep runner alive
        run: |
          echo "Runner alive for ~6 hours"
          sleep 21600
